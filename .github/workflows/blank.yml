name: Build Leksi APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Leksi 1.4.0 project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Leksi_Offline_Android_Project_v1.4.0.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Could not find $ZIP_FILE in the repository root. Upload this ZIP first."
            find . -maxdepth 1 -type f -iname '*.zip' -print || true
            exit 1
          fi
          rm -rf .leksi_unpack
          mkdir -p .leksi_unpack
          unzip -q "$ZIP_FILE" -d .leksi_unpack
          PROJECT_ROOT="$(find .leksi_unpack -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/. .
          test -f app/src/main/java/app/leksi/offline/MainActivity.kt
          grep -q 'private fun DictionaryScreen' app/src/main/java/app/leksi/offline/MainActivity.kt
          grep -q 'Leksi' README.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Leksi-1.4.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
